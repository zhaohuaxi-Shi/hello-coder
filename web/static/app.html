<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Coder</title>
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/images/app-icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>

<body class="page-app">
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button type="button" class="sidebar-brand" id="sidebar-brand" data-tip="Home" aria-label="Home">
          <img src="/assets/images/app-icon.png" alt="HELLO CODER" />
        </button>
      </div>
      <nav class="nav">
        <div class="nav-slot">
          <button type="button" class="nav-item" data-tool="kafka">
            <span class="nav-short">KFK</span>
            <span class="nav-full">Kafka</span>
          </button>
        </div>
        <div class="nav-slot">
          <button type="button" class="nav-item" data-tool="es">
            <span class="nav-short">ES</span>
            <span class="nav-full">Elasticsearch</span>
          </button>
        </div>
        <div class="nav-slot">
          <button type="button" class="nav-item" data-tool="redis">
            <span class="nav-short">RDS</span>
            <span class="nav-full">Redis</span>
          </button>
        </div>
      </nav>
      <div class="sidebar-foot">
        <button type="button" id="logout" class="logout-btn" data-tip="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 12H3M6 8l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="main workspace" id="workspace">
      <div class="workspace-tabbar" id="workspace-tabbar" role="tablist" aria-label="Open views"></div>
      <div class="workspace-panes" id="workspace-panes"></div>
    </main>
  </div>

  <script type="module" src="/assets/app.js"></script>
</body>

</html>
