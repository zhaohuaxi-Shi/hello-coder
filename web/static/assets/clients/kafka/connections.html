<section id="view-kafka" class="view">
  <header class="view-head">
    <div>
      <h2>Kafka Connections</h2>
      <p class="muted">Manage connections, check availability, view cluster nodes, open Topics</p>
    </div>
    <div class="actions">
      <button type="button" id="btn-refresh-conns" class="btn ghost">Refresh</button>
      <button type="button" id="btn-add-conn" class="btn">New connection</button>
    </div>
  </header>
  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Brokers</th>
          <th>Protocol</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="conn-tbody">
        <tr><td colspan="6" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</section>

<dialog id="dlg-conn" class="dialog">
  <form method="dialog" id="form-conn" class="dialog-body">
    <h3 id="dlg-conn-title">New connection</h3>
    <input type="hidden" id="conn-id" />
    <label class="field"><span>Name</span><input id="conn-name" required /></label>
    <label class="field"><span>Brokers</span><input id="conn-brokers" required placeholder="host1:9092,host2:9092" /></label>
    <label class="field">
      <span>Security protocol</span>
      <select id="conn-protocol">
        <option value="PLAINTEXT">PLAINTEXT</option>
        <option value="SASL_PLAINTEXT">SASL_PLAINTEXT</option>
        <option value="SASL_SSL">SASL_SSL</option>
        <option value="SSL">SSL</option>
      </select>
    </label>
    <label class="field"><span>SASL mechanism</span><input id="conn-sasl-mech" placeholder="PLAIN / SCRAM-SHA-256" /></label>
    <label class="field"><span>SASL username</span><input id="conn-sasl-user" /></label>
    <label class="field"><span>SASL password</span><input id="conn-sasl-pass" type="password" placeholder="leave blank to keep unchanged" /></label>
    <label class="field"><span>Description</span><input id="conn-desc" /></label>
    <p id="conn-msg" class="msg" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="conn-cancel" value="cancel">Cancel</button>
      <button type="button" class="btn ghost" id="conn-test">Test</button>
      <button type="submit" class="btn" id="conn-save">Save</button>
    </div>
  </form>
</dialog>

<div id="drawer-detail" class="drawer" aria-hidden="true">
  <div class="drawer-backdrop" data-drawer-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <div>
        <h3 id="drawer-title">Cluster details</h3>
        <p class="muted" id="drawer-sub"></p>
      </div>
      <div class="drawer-head-actions">
        <button type="button" id="btn-refresh-detail" class="btn ghost">Refresh</button>
        <button type="button" class="icon-btn" data-drawer-close title="Close">✕</button>
      </div>
    </header>
    <div class="drawer-body">
      <div id="cluster-summary" class="kv-grid"></div>
      <div class="table-wrap drawer-table">
        <table class="table">
          <thead>
            <tr>
              <th>Broker</th>
              <th>Address</th>
              <th>Rack</th>
              <th>Controller</th>
              <th>Connected</th>
              <th>Leaders</th>
              <th>Replicas</th>
              <th>Log size</th>
            </tr>
          </thead>
          <tbody id="node-tbody">
            <tr><td colspan="8" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </aside>
</div>
